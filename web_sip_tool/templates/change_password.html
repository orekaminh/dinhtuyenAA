<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - SIP Routing Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: var(--font-sans);
        }
        .change-card-pro {
            width: 380px;
            padding: 28px 24px;
            border-radius: var(--radius-md);
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="change-card-pro">
        <div class="text-center mb-3">
            <h4 class="fw-bold text-danger mb-1" style="font-size: 17px;">⚠️ Đổi Mật Khẩu</h4>
            <p class="text-muted" style="font-size: 12px; margin: 0;">
                Vui lòng cập nhật mật khẩu mới để tiếp tục sử dụng hệ thống.
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 px-3 small shadow-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="fw-bold" style="font-size: 12px; color: #334155;">Mật khẩu mới</label>
                <input type="password" name="new_password" class="code-textarea py-2 px-3" style="height: 38px;" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="fw-bold" style="font-size: 12px; color: #334155;">Xác nhận mật khẩu</label>
                <input type="password" name="confirm_password" class="code-textarea py-2 px-3" style="height: 38px;" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold" style="padding: 10px; font-size: 13.5px; margin-top: 6px;">
                Cập nhật & Vào Tool
            </button>
        </form>
        
        <div class="text-center mt-3 pt-3 border-top" style="font-size: 12px;">
            <a href="{{ url_for('logout') }}" class="text-decoration-none text-muted">← Đăng xuất</a>
        </div>
    </div>
</body>
</html>
