<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - SIP Routing Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: var(--font-sans);
        }
        .login-card-pro {
            width: 380px;
            padding: 28px 24px;
            border-radius: var(--radius-md);
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-card-pro">
        <div class="text-center mb-3">
            <div class="d-inline-flex align-items-center gap-1 mb-2" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px;">
                SNOC2
            </div>
            <h4 class="fw-bold" style="color: #0f172a; font-size: 18px; margin: 0;">SIP ROUTING SUITE</h4>
            <div class="text-muted small" style="font-size: 12px;">Hệ thống Điều khiển Định tuyến vIMS / AA</div>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 px-3 small shadow-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="fw-bold" style="font-size: 12px; color: #334155;">Tên đăng nhập</label>
                <input type="text" name="username" class="code-textarea py-2 px-3" style="font-family: var(--font-sans); height: 38px;" placeholder="Nhập username..." required autofocus>
            </div>
            <div class="mb-3">
                <label class="fw-bold" style="font-size: 12px; color: #334155;">Mật khẩu</label>
                <input type="password" name="password" class="code-textarea py-2 px-3" style="height: 38px;" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold" style="padding: 10px; font-size: 14px; margin-top: 6px;">
                Đăng nhập hệ thống
            </button>
        </form>
        
        <div class="text-center mt-3 pt-3 border-top" style="font-size: 11px; color: #94a3b8;">
            &copy; 2026 SIP Routing Tool | VNPT SNOC2 | Phiên bản Web
        </div>
    </div>
</body>
</html>
